# Environment of the SpeedyWeather coupling tests (test/test_with_speedyweather.jl).
# Kept apart from test/Project.toml because the coupling needs SpeedyWeather >= 0.23 (the
# `Radiation` bundle and its NumericalRadiation extension), which is not registered yet and
# is pulled from its development branch through the [sources] entry below; that needs
# Julia >= 1.11, whereas the package and its core tests support Julia 1.10. Run with
#   julia --project=test/speedyweather -e 'using Pkg; Pkg.instantiate()'
#   julia --project=test/speedyweather --check-bounds=yes test/speedyweather/runtests.jl
# Remove the SpeedyWeather source once 0.23 is released.

[deps]
NCDatasets = "85f8d34a-cbdd-5861-8df4-14fed0d494ab"
NumericalRadiation = "cd8119b0-1744-44d6-9ede-6ad1ad750b26"
SpeedyWeather = "9e226e20-d153-4fed-8a5b-493def4f21a9"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[compat]
SpeedyWeather = "0.23"

[sources]
NumericalRadiation = {path = "../.."}
SpeedyWeather = {url = "https://github.com/SpeedyWeather/SpeedyWeather.jl.git", rev = "mg/numericalradiation-extension", subdir = "SpeedyWeather"}
